server:
  port: ${PORT:8080}
  forward-headers-strategy: none

spring:
  application:
    name: dagantara-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dagantara}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        "[logServerErrorDetail]": false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  tenant:
    platform-host: ${APP_PLATFORM_HOST:localhost}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret-base64: ${APP_JWT_SECRET_BASE64:}
      issuer: ${APP_JWT_ISSUER:dagantara-backend}
      audience: ${APP_JWT_AUDIENCE:dagantara-api}
      access-token-ttl: ${APP_JWT_TTL:PT30M}
    bootstrap:
      username: ${APP_BOOTSTRAP_USERNAME:}
      password-hash: ${APP_BOOTSTRAP_PASSWORD_HASH:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
