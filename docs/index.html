<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>User Management — Database Diagram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #37352f; }
    .diagram svg { display: block; max-width: none; height: auto; margin: 0 auto; }
    .diagram { overflow: auto; scrollbar-color: #d6d5d2 transparent; }
  </style>
</head>
<body class="min-h-screen bg-white">
  <div class="min-h-screen md:flex">
    <aside class="hidden md:flex md:w-60 md:shrink-0 flex-col border-r border-[#e9e9e7] bg-[#f7f7f5] px-3 py-5">
      <div class="flex items-center gap-2 px-2 text-sm font-semibold tracking-tight">
        <span class="flex h-6 w-6 items-center justify-center rounded-md border border-[#e1e1df] bg-white text-xs">N</span>
        Database Docs
      </div>
      <div class="mt-8 px-2 text-[11px] font-semibold text-[#9b9a97]">DATABASE</div>
      <div class="mt-2 rounded-md bg-[#e9e9e7] px-3 py-2 text-[13px] font-medium">▦ &nbsp; User Management</div>
    </aside>

    <main class="min-w-0 flex-1">
      <header class="flex h-12 items-center border-b border-[#f0f0ee] px-5 text-[13px] text-[#787774] md:px-10">
        <span class="md:hidden mr-2 text-[#37352f] font-semibold">Database Docs</span>
        <span class="hidden md:inline">Database</span>
        <span class="mx-2 hidden md:inline text-[#bdbdb9]">/</span>
        <span class="text-[#37352f]">User Management</span>
      </header>

      <section class="mx-auto w-full max-w-7xl px-5 pb-16 pt-12 md:px-10 md:pt-16">
        <div class="mb-8 flex h-12 w-12 items-center justify-center rounded-lg bg-[#f4f4f2] text-3xl">▦</div>
        <h1 id="doc-title" class="text-3xl font-bold tracking-tight md:text-[40px]">User Management</h1>
        <div class="mt-10 overflow-hidden rounded-lg border border-[#e9e9e7] bg-white">
          <div class="flex items-center justify-between border-b border-[#f0f0ee] px-4 py-3 text-xs text-[#9b9a97]">
            <span>Entity Relationship Diagram</span>
          </div>
          <div id="diagram" class="diagram min-h-[360px] p-4 md:p-8" aria-label="Diagram tabel User Management" role="img">
            <div class="py-12 text-center text-sm text-[#9b9a97]">Memuat diagram...</div>
          </div>
        </div>
        <div id="read-error" class="mt-5 hidden rounded-md bg-[#f7f7f5] p-4 text-sm text-[#787774]">
          Tidak dapat membaca README.md. Jalankan kedua file melalui web server, atau pilih README.md di bawah.
          <input type="file" id="read-local" accept=".md,text/markdown,text/plain" class="mt-3 block w-full text-sm" />
        </div>
      </section>
    </main>
  </div>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict',
      themeVariables: { fontFamily: 'ui-sans-serif, system-ui, sans-serif', primaryColor: '#f7f7f5', primaryTextColor: '#37352f', primaryBorderColor: '#d8d8d5', lineColor: '#9b9a97' }
    });

    async function displayMarkdown(markdown) {
      const title = markdown.match(/^#\s+(.+)$/m)?.[1]?.trim();
      if (title) {
        document.getElementById('doc-title').textContent = title;
        document.title = title + ' — Database Diagram';
      }
      const diagram = markdown.match(/```mermaid\s*\n([\s\S]*?)\n```/i)?.[1];
      if (!diagram) throw new Error('README.md tidak berisi diagram Mermaid.');
      const target = document.getElementById('diagram');
      try {
        const result = await mermaid.render('database-erd', diagram);
        target.innerHTML = result.svg;
        document.getElementById('read-error').classList.add('hidden');
      } catch (error) {
        target.innerHTML = '<p class="py-10 text-center text-sm text-red-700">Diagram tidak dapat ditampilkan: ' + escapeHTML(error.message) + '</p>';
      }
    }

    function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    fetch('./README.md', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error('Gagal membaca README.md'); return response.text(); })
      .then(displayMarkdown)
      .catch(() => {
        document.getElementById('diagram').innerHTML = '';
        document.getElementById('read-error').classList.remove('hidden');
      });

    document.getElementById('read-local').addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (file) await displayMarkdown(await file.text());
    });
  </script>
</body>
</html>
